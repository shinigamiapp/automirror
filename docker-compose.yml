services:
  scraper-worker:
    build: .
    expose:
      - "3000"
    environment:
      # Nginx-proxy & SSL
      - VIRTUAL_HOST=${VIRTUAL_HOST:-apollo.shinigami.io}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-apollo.shinigami.io}
      - LETSENCRYPT_TEST=false
      - NODE_ENV=production
      # MySQL (local — intentionally kept out of Doppler)
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-automirror}
      - MYSQL_USER=${MYSQL_USER:-automirror}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # Doppler injects all remaining secrets at container startup
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
    restart: unless-stopped
    networks:
      - db-network
      - proxy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db-backup:
    image: ghcr.io/realorangeone/db-auto-backup:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - db_backups:/var/backups
    environment:
      - SCHEDULE=0 * * * *
      - COMPRESSION=gzip
    restart: unless-stopped

  db-sync:
    build: ./backup
    depends_on:
      - db-backup
    volumes:
      - db_backups:/var/backups:ro
    environment:
      # Doppler injects R2 credentials and backup config at container startup
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
    restart: unless-stopped

networks:
  db-network:
    external: true
  proxy-network:
    external: true

volumes:
  db_backups:
